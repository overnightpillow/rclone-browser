name: release

# Releases cannot come from Gitea: the push mirror carries git refs only, so a
# tag arrives here but a Gitea release and its attachments do not. Building the
# artifacts on GitHub is what puts a download next to the tag.
#
# The release is left as a **draft** — publishing is a deliberate act, and
# neither the macOS bundle nor the Windows installer is signed by a certificate
# any operating system trusts, so both deserve a look before they are public.

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a draft release for
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt6
        run: brew install qt cmake ninja

      - name: Build the disk image
        run: scripts/release_macOS.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          retention-days: 14

  linux:
    # Not ubuntu-latest: the glibc of whatever runs this becomes the floor for
    # everyone downloading the AppImage, so it is pinned deliberately rather
    # than moved by a runner-image update. 24.04 is also the oldest Ubuntu
    # carrying the Qt 6.4 this needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file patchelf \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      - name: Build the AppImage
        run: scripts/release_AppImage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build the installer and the portable zip
        shell: pwsh
        run: scripts/release_windows.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip
          retention-days: 14

  draft:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "$(cat <<'NOTES'
          See [CHANGELOG.md](CHANGELOG.md) for what changed.

          ## Downloads

          | Platform | File | Notes |
          |---|---|---|
          | macOS (Apple silicon and Intel) | `*-macos.dmg` | Open it and drag the application to Applications |
          | Linux (x86_64) | `*-linux-x86_64.AppImage` | `chmod +x` it and run it; needs glibc 2.39 or newer |
          | Windows (x64) | `*-windows-x64-setup.exe` | Or take the `.zip` for a portable copy |

          Verify a download against `SHA256SUMS`.

          ### macOS: "cannot be opened because the developer cannot be verified"

          The bundle is ad-hoc signed rather than notarized, so macOS quarantines
          it. After dragging it to Applications:

          ```
          xattr -dr com.apple.quarantine /Applications/rclone-browser.app
          ```

          ### Windows: "Windows protected your PC"

          The installer is unsigned, so SmartScreen warns about it. **More info**
          then **Run anyway**, or use the portable zip.

          ### rclone

          Not bundled — install rclone separately and point the application at it
          in Preferences if it is not on your PATH.
          NOTES
          )"
          fi
          gh release upload "$TAG" release/* --clobber
