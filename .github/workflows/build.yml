name: build

# Mirror of .gitea/workflows/build.yml — the repository is pushed to both
# Gitea and GitHub, so keep the two in step when either changes.
#
# The windows job is the exception, and only lives here: Gitea's runners are
# Linux containers. It exists because the Windows-only code compiles nowhere
# else, and a call there passed the wrong type to compareVersion from the Qt6
# port until the first release build finally put it in front of a Windows
# compiler. Once per release is too late to find that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      - name: Configure
        # -Werror is opt-in so a new compiler cannot break the default build;
        # CI is exactly where it should be switched on.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRRM_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # The widget tests drive real Qt widgets but need no display: each test
        # target sets QT_QPA_PLATFORM=offscreen itself.
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: brew install qt cmake ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRRM_WERROR=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The windows job is the exception, and only lives here: Gitea's runners are
  # Linux containers.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        # No -Werror here yet: MSVC's warnings are a different set from GCC's
        # and clang's, and nobody has read through them once. Compiling at all
        # is the bar this job is setting.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        # Compiler errors are echoed back as workflow annotations, which are
        # readable without signing in -- unlike the logs. Debugging a platform
        # you cannot reproduce is hard enough without that.
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+' |
              Select-Object -First 15 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        # Failures come back as annotations for the same reason the build step
        # does it: the logs need a GitHub login, annotations do not.
        #
        # The whole log goes into one annotation rather than a grep for
        # 'FAIL!': a test that exits non-zero without printing a QTest failure
        # -- a crash, an abort, a qFatal -- left nothing to grep for, and the
        # annotation said only that something had failed.
        run: |
          ctest --test-dir build --output-on-failure 2>&1 |
            Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            # The per-test result files carry what stdout did not. Only the
            # failing ones: all four together overflow an annotation, and the
            # passing runs push the interesting file out of it.
            $results = Get-ChildItem -Path build -Recurse -Filter '*-results.txt' |
              Where-Object { Select-String -Path $_.FullName -Pattern '^(FAIL|XPASS|QFATAL)' -Quiet } |
              ForEach-Object { "--- $($_.Name) ---"; Get-Content $_.FullName }
            if (-not $results) {
              $results = Get-ChildItem -Path build -Recurse -Filter 'test_widgets-results.txt' |
                ForEach-Object { "--- $($_.Name) (no FAIL line) ---"; Get-Content $_.FullName }
            }
            $log = ((Get-Content test.log -Tail 100) + $results) -join "`n"
            $log = $log -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error::$log"
            exit 1
          }
